name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Browser-safe staff project address and API base. The publishable
          # key stays in Actions secrets. A missing key leaves the portal on
          # the configuration screen and does not grant staff access.
          VITE_SUPABASE_URL: https://rjqazivpwvhztgfbqjkq.supabase.co
          VITE_API_BASE_URL: https://mawahib-backend-production.up.railway.app/api/v1
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Add the route fallback and reject demo or server credentials
        run: |
          cp dist/index.html dist/404.html
          if grep -R -n -E 'Omar Al-Harbi|Enter demo|PREVIEW-SECRET|Preview only|service_role|DATABASE_URL' dist; then
            echo "Production bundle contains a demo fixture or a server credential."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
