name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Browser-safe staff project address and API base. The publishable
          # key stays in Actions secrets. A missing key leaves the portal on
          # the configuration screen and does not grant staff access.
          VITE_SUPABASE_URL: https://rjqazivpwvhztgfbqjkq.supabase.co
          VITE_API_BASE_URL: https://mawahib-backend-production.up.railway.app/api/v1
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Add the route fallback and reject demo or server credentials
        run: |
          cp dist/index.html dist/404.html
          if grep -R -n -E 'Omar Al-Harbi|Enter demo|PREVIEW-SECRET|Preview only|service_role|DATABASE_URL' dist; then
            echo "Production bundle contains a demo fixture or a server credential."
            exit 1
          fi
      - name: Publish the site branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cp -R dist /tmp/portal-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout --force -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R /tmp/portal-dist/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Site branch already matches this build."
          else
            git commit -m "Publish the staff portal"
            git push origin gh-pages
          fi
